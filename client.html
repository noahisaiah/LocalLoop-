<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalLoop — My services</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0e0f11;color:#f2f2ef;max-width:720px;margin:0 auto;padding:24px;line-height:1.5}
  .card{background:#17191d;border:1px solid #26292f;border-radius:14px;padding:20px;margin-top:16px}
  input,button{padding:10px;border-radius:10px} input{border:1px solid #333;background:#17191d;color:#fff;width:70%}
  button{background:#2dd4bf;color:#081210;font-weight:700;border:0;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<h1>My LocalLoop services</h1>
<p>Enter your business name exactly as LocalLoop has it. You will only see services here if your account is active and paid up — that check is made by the database, not by this page.</p>
<p><input id="q" placeholder="Business name"> <button id="go">Check</button></p>
<div id="out"></div>
<script>
const { supabaseUrl, supabaseAnonKey } = window.LOCALLOOP_CONFIG;
const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
const LABELS = {voice_ai:"Voice AI — talks to customers",ai_replies:"AI customer replies",booking:"Booking & scheduling",lead_followup:"Lead follow-up",reviews:"Reviews & feedback",reminders:"Reminders & invoicing"};
document.getElementById("go").onclick = async () => {
  const name = document.getElementById("q").value.trim();
  const out = document.getElementById("out");
  if (!name) return;
  // RLS: locked or expired businesses return no row, by design.
  const { data, error } = await supabase.from("businesses").select("name,plan,paid_until,voice_ai,ai_replies,booking,lead_followup,reviews,reminders").ilike("name", name);
  if (error) { out.innerHTML = `<p>${error.message}</p>`; return; }
  if (!data.length) { out.innerHTML = `<div class="card"><h2>Access locked</h2><p>This business is not currently active, or its paid period has ended. If you have just paid, contact LocalLoop — access is unlocked once payment is confirmed.</p></div>`; return; }
  const b = data[0];
  const on = Object.keys(LABELS).filter(f => b[f]);
  out.innerHTML = `<div class="card"><h2>${b.name} — ${b.plan}</h2><p>Paid until: ${b.paid_until || "—"}</p>` +
    (on.length ? `<ul>${on.map(f => `<li>${LABELS[f]}</li>`).join("")}</ul>` : `<p>No services are switched on for this business yet.</p>`) + `</div>`;
};
</script>
</body>
</html>
